name: Update TypeRacer badge

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and build scorecard
        env:
          TYPERACER_USERNAME: shivangb237
          TYPERACER_API_KEY: ${{ secrets.TYPERACER_API_KEY }}
        run: |
          TOKEN=$(printf '%s' "$TYPERACER_USERNAME:$TYPERACER_API_KEY" | base64 -w0)
          RESPONSE=$(curl -sS -H "Authorization: Basic $TOKEN" \
            "https://data.typeracer.com/api/v1/racers/$TYPERACER_USERNAME/stats")
          echo "API response: $RESPONSE"

          PLAY=$(echo "$RESPONSE" | jq -c '[.data[] | select(.universe=="play")][0] // .data[0]')
          AVG_RAW=$(echo "$PLAY" | jq -r '.avg_wpm')
          BEST_RAW=$(echo "$PLAY" | jq -r '.best_wpm')
          RACES=$(echo "$PLAY" | jq -r '.total_races')

          if [ -z "$AVG_RAW" ] || [ "$AVG_RAW" = "null" ]; then
            echo "Could not find avg_wpm in the response above — check its shape and adjust the jq path."
            exit 1
          fi

          AVG_WPM=$(printf "%.1f" "$AVG_RAW")
          BEST_WPM=$(printf "%.0f" "$BEST_RAW")

          cat > typeracer-badge.svg <<EOF
          <svg width="420" height="150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TypeRacer scorecard for ${TYPERACER_USERNAME}: ${AVG_WPM} wpm average, ${BEST_WPM} wpm best, ${RACES} races">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1b3a63"/>
                <stop offset="1" stop-color="#0f2542"/>
              </linearGradient>
            </defs>
            <rect width="420" height="150" rx="12" fill="url(#bg)"/>
            <rect x="0.5" y="0.5" width="419" height="149" rx="11.5" fill="none" stroke="#2e5c8a" stroke-width="1"/>

            <text x="20" y="30" font-family="Verdana, Geneva, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">⌨ typeracer</text>
            <text x="400" y="30" font-family="Verdana, Geneva, sans-serif" font-size="10" fill="#7fa8d0" text-anchor="end" letter-spacing="1">SCORECARD</text>
            <line x1="20" y1="40" x2="400" y2="40" stroke="#2e5c8a" stroke-width="1"/>

            <text x="20" y="78" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#8fb6da">Average Typing Speed</text>
            <text x="20" y="118" font-family="Verdana, Geneva, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">${AVG_WPM}<tspan font-size="16" fill="#8fb6da" dx="6">WPM</tspan></text>

            <rect x="248" y="55" width="152" height="30" rx="6" fill="#2c6e6e"/>
            <text x="324" y="75" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">${BEST_WPM} WPM Best</text>

            <rect x="248" y="93" width="152" height="30" rx="6" fill="#2c6e6e"/>
            <text x="324" y="113" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">${RACES} Races</text>

            <text x="20" y="138" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#6f93b8">${TYPERACER_USERNAME} &#183; powered by typeracer.com</text>
          </svg>
          EOF

      - name: Commit badge if changed
        run: |
          git add typeracer-badge.svg
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update TypeRacer badge"
          git push
